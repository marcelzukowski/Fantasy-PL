[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fpl-prediction-engine"
version = "0.1.0"
description = "Fantasy Premier League prediction and decision engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core runtime dependencies.
    "pandas",
    "polars",
    "pyarrow",
    "duckdb",
    "pytz",
    "numpy",
    "scipy",
    "scikit-learn",
    "pydantic>=2.0",
    "PyYAML",
    "requests",
    "httpx",
    "tenacity",
    # Modelling dependencies.
    "catboost",
    "statsmodels",
]

[project.optional-dependencies]
optuna = ["optuna"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "hypothesis==6.170.5", "ruff==0.17.1", "pre-commit==4.7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["scratch", "data", "build", "dist", ".venv-solver"]

[tool.ruff.lint]
# Start with correctness errors; existing production style is not migrated here.
select = ["E9", "F63", "F7", "F82"]
