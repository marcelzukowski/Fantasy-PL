      goalkeeper: {bps: 12}
      defender: {bps: 12}
      midfielder: {bps: 18}
      forward: {bps: 24}
  assists: {bps_per_assist: 9}
  clean_sheet:
    goalkeeper: {bps: 12}
    defender: {bps: 12}
    midfielder: {bps: 0}
    forward: {bps: 0}
  goalkeeper:
