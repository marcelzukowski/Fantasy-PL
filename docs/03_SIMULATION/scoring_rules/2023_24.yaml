  allocation:
    standard: {first: 3, second: 2, third: 1}
  rules:
    - "Ties for first, second and third use the standard FPL shared-rank allocation."
bps:
  appearance:
    minutes_1_to_60: {bps: 3}
    over_60_minutes: {bps: 6}
  goals:
    penalty_goal: {bps: 12}
