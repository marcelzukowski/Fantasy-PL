  rules: {stoppage_time_counts_toward_60_threshold: false}
goals:
  goalkeeper: {points_per_goal: 6}
  defender: {points_per_goal: 6}
  midfielder: {points_per_goal: 5}
  forward: {points_per_goal: 4}
assists: {points_per_assist: 3}
clean_sheets:
  minimum_minutes: 60
  stoppage_time_counts_toward_minimum: false
  points: {goalkeeper: 4, defender: 4, midfielder: 1, forward: 0}
