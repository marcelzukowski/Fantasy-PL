  red: {points: -3}
own_goals: {points_per_own_goal: -2}
defensive_contributions:
  enabled: false
  maximum_points_per_player_per_fixture: 0
  goalkeeper: {eligible: false, threshold: 999999, points: 0}
  defender: {eligible: false, threshold: 999999, points: 0}
  midfielder: {eligible: false, threshold: 999999, points: 0}
  forward: {eligible: false, threshold: 999999, points: 0}
