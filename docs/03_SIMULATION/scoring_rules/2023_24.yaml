    save: {bps_per_action: 2}
    save_from_inside_box: {additional_bps_per_action: 1}
    save_from_big_chance: {additional_bps_per_action: 1}
    penalty_save: {additional_bps_per_action: 13}
  attacking_actions:
    successful_open_play_cross: {bps_per_action: 1}
    chance_created: {bps_per_action: 1}
    big_chance_created: {bps_per_action: 3}
    successful_dribble: {bps_per_action: 1}
    shot_on_target: {bps_per_action: 0}
    winning_goal: {bps_per_action: 3}
    foul_won: {bps_per_action: 0}
  defensive_actions:
    clearances_blocks_interceptions: {group_size: 3, bps_per_complete_group: 1}
    recoveries: {group_size: 3, bps_per_complete_group: 1}
    successful_tackle: {bps_per_action: 2}
    goal_line_clearance: {bps_per_action: 0}
  passing:
