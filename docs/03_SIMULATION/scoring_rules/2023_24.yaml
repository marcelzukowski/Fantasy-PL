    completion_80_to_89_percent: {bps: 4}
    completion_90_plus_percent: {bps: 6}
  negative_actions:
    goalkeeper_or_defender_concedes_goal: {bps_per_goal: 0}
    penalty_conceded: {bps_per_action: -3}
    penalty_missed: {bps_per_action: -6}
    yellow_card: {bps_per_action: -3}
    red_card: {bps_per_action: -9}
    own_goal: {bps_per_action: -6}
    big_chance_missed: {bps_per_action: -3}
    error_leading_to_goal: {bps_per_action: -3}
