```yaml
version: 1

project: FPL Prediction & Decision Engine

description: >
  Implementation roadmap for building the complete FPL prediction and
  decision system incrementally without creating a disposable MVP.

  Each task should be small enough to be completed, tested and reviewed
  independently by Codex.

# =============================================================================
# EXECUTION PRINCIPLES
# =============================================================================

execution_rules:

  architecture:
    - "Implement the final architecture incrementally."
    - "Do not create throw-away components that will later require redesign."
    - "Stable interfaces and canonical schemas come before model complexity."
    - "Models must never depend directly on provider-specific response schemas."

  codex:
    one_task_per_run: true

    required_reading:
      - "docs/00_PROJECT_CONTEXT.md"
      - "relevant module specification"
      - "docs/01_DATA/leakage_rules.md"
      - "this roadmap task"

    instructions:
      - "Implement only the requested task."
      - "Do not implement future roadmap tasks unless required by the current task contract."
      - "Run relevant tests before finishing."
      - "Do not silently change documented interfaces."
      - "If specification and existing code conflict, report the conflict rather than inventing a new architecture."

  completion:
    task_is_done_only_if:
      - implementation_complete
      - tests_added
      - tests_pass
      - interfaces_match_specification
      - documentation_updated_if_required

  priorities:
    P0: required_for_core_system
    P1: important_after_core
    P2: optional_advanced

# =============================================================================
# PROJECT PHASES
# =============================================================================

phases:

  - id: PHASE-01
    name: Foundation
    goal: "Create canonical project infrastructure and stable data contracts."

  - id: PHASE-02
    name: Data ingestion
    goal: "Build reproducible, cached, point-in-time-safe data acquisition."

  - id: PHASE-03
    name: Canonical data layer
    goal: "Normalize provider data and build model-ready temporal datasets."

  - id: PHASE-04
    name: Team and context models
    goal: "Build team strength, tactical context and availability."

  - id: PHASE-05
    name: Minutes and talent
    goal: "Build player playing-time and underlying-talent models."

  - id: PHASE-06
    name: Event prediction
    goal: "Generate fixture-specific football event probabilities."

  - id: PHASE-07
    name: Simulation and scoring
    goal: "Simulate coherent matches and convert them into FPL points."

  - id: PHASE-08
    name: Projection layer
    goal: "Create single- and multi-GW player projection distributions."

  - id: PHASE-09
    name: Optimizer
    goal: "Create valid FPL squad, transfer and chip decisions."

  - id: PHASE-10
    name: Backtesting
    goal: "Prove every model and strategy out of sample."

  - id: PHASE-11
    name: Production pipeline
    goal: "Automate current-GW refresh, predictions and recommendations."

# =============================================================================
# PHASE 01 — FOUNDATION
# =============================================================================

tasks:

  - id: CORE-001
    phase: PHASE-01
    title: "Create package structure"
    priority: P0
    status: not_started

    objective: >
      Create the Python package structure for data, features, models,
      simulation, scoring, optimization and validation.

    outputs:
      - "src/fpl_engine/"
      - "src/fpl_engine/data/"
      - "src/fpl_engine/features/"
      - "src/fpl_engine/models/"
      - "src/fpl_engine/simulation/"
      - "src/fpl_engine/scoring/"
      - "src/fpl_engine/optimizer/"
      - "src/fpl_engine/validation/"
      - "src/fpl_engine/config/"
      - "tests/"

    tests:
      - "Package imports successfully."
      - "pytest can discover tests."

    definition_of_done:
      - "No business logic required."
      - "Project imports without errors."

  - id: CORE-002
    phase: PHASE-01
    title: "Create dependency configuration"
    priority: P0
    status: not_started
    depends_on:
      - CORE-001

    objective: >
      Create Python project dependency and tooling configuration.

    recommended_dependencies:
      core:
        - pandas
        - polars
        - pyarrow
        - duckdb
        - numpy
        - scipy
        - scikit-learn
        - pydantic
        - pyyaml
        - requests
        - httpx
        - tenacity
      modelling:
        - catboost
        - statsmodels
      validation:
        - pytest
        - pytest-cov
      optional:
        - optuna

    outputs:
      - "pyproject.toml"

    tests:
      - "Dependencies install."
      - "Package import test passes."

  - id: CORE-003
    phase: PHASE-01
    title: "Implement configuration loader"
    priority: P0
    status: not_started
    depends_on:
      - CORE-001
      - CORE-002

    objective: >
      Load YAML project configuration with validation and typed access.

    inputs:
      - "docs/01_DATA/data_sources.yaml"
      - "docs/03_SIMULATION/scoring_rules.yaml"
      - "docs/04_OPTIMIZER/fpl_rules.yaml"

    outputs:
      - "src/fpl_engine/config/loader.py"

    tests:
      - "Valid YAML loads."
      - "Missing required config fails explicitly."
      - "Invalid YAML fails explicitly."

  - id: CORE-004
    phase: PHASE-01
    title: "Implement project logging"
    priority: P0
    status: not_started

    objective: >
      Add structured logging for ingestion, model training, simulation,
      optimization and backtesting.

    outputs:
      - "src/fpl_engine/logging.py"

    tests:
      - "Logger initializes."
      - "Context metadata can be attached."

  - id: CORE-005
    phase: PHASE-01
    title: "Implement canonical metadata types"
    priority: P0
    status: not_started
    depends_on:
      - CORE-001

    objective: >
      Define canonical metadata structures used throughout the pipeline.

    required_types:
      - PredictionContext
      - DatasetVersion
      - FeatureVersion
      - ModelVersion
      - SourceProvenance

    required_fields:
      PredictionContext:
        - prediction_timestamp
        - target_gameweek

    outputs:
      - "src/fpl_engine/types.py"

    tests:
      - "Prediction timestamp is mandatory."
      - "Invalid timestamps fail validation."

# =============================================================================
# PHASE 02 — DATA INGESTION
# =============================================================================

  - id: DATA-001
    phase: PHASE-02
    title: "Implement raw data storage"
    priority: P0
    status: not_started
    depends_on:
      - CORE-003

    objective: >
      Create append-only storage for immutable raw provider responses.

    storage:
      format:
        - json
        - parquet
      structure: "data/raw/{provider}/{entity}/{date_or_season}/"

    requirements:
      - source_provider
      - retrieved_at
      - checksum
      - raw payload preservation

    outputs:
      - "src/fpl_engine/data/raw_store.py"

    tests:
      - "Existing snapshot is not overwritten."
      - "Checksum is deterministic."
      - "UTC retrieval time stored."

  - id: DATA-002
    phase: PHASE-02
    title: "Implement HTTP cache"
    priority: P0
    status: not_started
    depends_on:
      - DATA-001

    objective: >
      Prevent repeated provider calls and support free API quotas.

    outputs:
      - "src/fpl_engine/data/http_cache.py"

    tests:
      - "Cached request avoids second HTTP call."
      - "Cache invalidation works."
      - "Immutable historical response remains cached."

  - id: DATA-003
    phase: PHASE-02
    title: "Implement Official FPL API adapter"
    priority: P0
    status: not_started
    depends_on:
      - DATA-001
      - DATA-002

    specification:
      source: official_fpl_api

    endpoints:
      - bootstrap-static
      - fixtures
      - element-summary
      - event-live

    outputs:
      - "src/fpl_engine/data/providers/fpl_api.py"

    tests:
      - "Response can be loaded from fixture files without network."
      - "Raw response is persisted."
      - "Provider errors fail cleanly."

  - id: DATA-004
    phase: PHASE-02
    title: "Implement Vaastav adapter"
    priority: P0
    status: not_started

    objective: >
      Load historical FPL Gameweek datasets and preserve source version.

    outputs:
      - "src/fpl_engine/data/providers/vaastav.py"

    tests:
      - "Historical season loads."
      - "Source commit/version is recorded."
      - "xP is not automatically included as a safe feature."

  - id: DATA-005
    phase: PHASE-02
    title: "Implement fplcache adapter"
    priority: P0
    status: not_started

    objective: >
      Read historical FPL snapshots and select point-in-time-safe snapshots.

    outputs:
      - "src/fpl_engine/data/providers/fplcache.py"

    tests:
      - "Latest snapshot strictly before deadline is selected."
      - "Future snapshot is never selected."
      - "Missing pre-deadline snapshot returns missing state."

  - id: DATA-006
    phase: PHASE-02
    title: "Implement API-Football adapter"
    priority: P0
    status: not_started
    depends_on:
      - DATA-002

    endpoints_priority:
      - fixtures
      - lineups
      - injuries
      - sidelined
      - transfers
      - coaches
      - player_statistics

    requirements:
      - quota tracking
      - caching
      - bulk requests where possible

    outputs:
      - "src/fpl_engine/data/providers/api_football.py"

    tests:
      - "Cached endpoint uses no quota."
      - "Quota exhaustion fails gracefully."
      - "Provider IDs remain provider-specific."

  - id: DATA-007
    phase: PHASE-02
    title: "Implement StatsBomb Open Data adapter"
    priority: P1
    status: not_started

    outputs:
      - "src/fpl_engine/data/providers/statsbomb_open.py"

    required_datasets:
      - competitions
      - matches
      - lineups
      - events

    tests:
      - "Competition coverage is explicit."
      - "Missing competition is not interpreted as zero."

  - id: DATA-008
    phase: PHASE-02
    title: "Implement football-data.co.uk adapter"
    priority: P0
    status: not_started

    objective: >
      Load historical match statistics and bookmaker files.

    outputs:
      - "src/fpl_engine/data/providers/football_data.py"

    tests:
      - "CSV schema variation handled."
      - "Original columns preserved."
      - "Odds fields can be marked point-in-time unsafe."

  - id: DATA-009
    phase: PHASE-02
    title: "Implement local FPL snapshot collector"
    priority: P0
    status: not_started
    depends_on:
      - DATA-003

    objective: >
      Store current FPL state snapshots for future point-in-time backtesting.

    output_path:
      "data/snapshots/official_fpl_api/{timestamp}/"

    tests:
      - "Snapshot is append-only."
      - "Timestamp and checksum stored."

  - id: DATA-010
    phase: PHASE-02
    title: "Implement manual context loader"
    priority: P0
    status: not_started

    objective: >
      Load temporal manual tactical/context overrides.

    outputs:
      - "src/fpl_engine/data/manual_context.py"
      - "config/manual_context.yaml"

    required_fields:
      - effective_from
      - effective_to
      - created_at
      - confidence
      - reason

    tests:
      - "Future-created override cannot be used historically."
      - "Expired override is not active."

# =============================================================================
# PHASE 03 — CANONICAL DATA
# =============================================================================

  - id: ID-001
    phase: PHASE-03
    title: "Create canonical entity schemas"
    priority: P0
    status: not_started
    depends_on:
      - CORE-005

    entities:
      - player
      - team
      - fixture
      - manager
      - competition

    outputs:
      - "src/fpl_engine/data/schemas/entities.py"

    tests:
      - "Canonical IDs cannot be provider IDs by assumption."
      - "Entity schemas validate."

  - id: ID-002
    phase: PHASE-03
    title: "Implement player identity resolution"
    priority: P0
    status: not_started
    depends_on:
      - ID-001

    specification:
      - "docs/01_DATA/identity_resolution.md"

    outputs:
      - canonical_player_map
      - unresolved_player_queue

    tests:
      - "Exact mapping."
      - "Alias mapping."
      - "Transfer preserves player identity."
      - "Ambiguous fuzzy match is not auto-confirmed."

  - id: ID-003
    phase: PHASE-03
    title: "Implement team identity resolution"
    priority: P0
    status: not_started
    depends_on:
      - ID-001

    tests:
      - "Provider team IDs map to one canonical team."
      - "Historical name change can be represented."

  - id: ID-004
    phase: PHASE-03
    title: "Implement fixture identity resolution"
    priority: P0
    status: not_started
    depends_on:
      - ID-003

    requirements:
      - home team
      - away team
      - competition
      - season
      - kickoff tolerance

    tests:
      - "Postponed fixture remains same canonical fixture."
      - "DGW gameweek is not part of fixture identity."

  - id: ID-005
    phase: PHASE-03
    title: "Implement temporal player-team spells"
    priority: P0
    status: not_started
    depends_on:
      - ID-002
      - ID-003

    outputs:
      - dim_player_team_spell

    tests:
      - "Transfer changes spell."
      - "Prediction resolves club valid at timestamp."

  - id: ID-006
    phase: PHASE-03
    title: "Implement temporal manager-team spells"
    priority: P0
    status: not_started

    outputs:
      - dim_manager_team_spell

    tests:
      - "Manager change respects effective dates."

  - id: DATA-011
    phase: PHASE-03
    title: "Create canonical DuckDB schema"
    priority: P0
    status: not_started
    depends_on:
      - ID-001

    required_tables:
      - dim_player
      - dim_team
      - dim_fixture
      - dim_manager
      - dim_competition
      - dim_player_provider_map
      - dim_team_provider_map
      - dim_player_team_spell
      - dim_manager_team_spell
      - fact_player_fixture
      - fact_team_fixture
      - fact_fpl_snapshot

    outputs:
      - "src/fpl_engine/data/database.py"

    tests:
      - "Schema creation is idempotent."

  - id: DATA-012
    phase: PHASE-03
    title: "Build canonical FPL player-fixture table"
    priority: P0
    status: not_started
    depends_on:
      - DATA-003
      - DATA-004
      - ID-002
      - ID-004
      - DATA-011

    outputs:
      - fact_player_fixture

    tests:
      - "One player-fixture row per canonical identity."
      - "No duplicate fixture-player keys."

  - id: DATA-013
    phase: PHASE-03
    title: "Build canonical team-fixture table"
    priority: P0
    status: not_started
    depends_on:
      - DATA-008
      - ID-004
      - DATA-011

    outputs:
      - fact_team_fixture

    tests:
      - "Exactly two team rows per completed fixture where data exists."

  - id: DATA-014
    phase: PHASE-03
    title: "Build point-in-time snapshot resolver"
    priority: P0
    status: not_started
    depends_on:
      - DATA-005
      - DATA-009

    interface:
      resolve_state:
        inputs:
          - entity
          - prediction_timestamp
        rule: "latest known state at or before prediction timestamp"

    tests:
      - "Future state never returned."

  - id: DATA-015
    phase: PHASE-03
    title: "Implement leakage assertion utilities"
    priority: P0
    status: not_started

    outputs:
      - "src/fpl_engine/validation/leakage.py"

    tests:
      - "Feature after prediction timestamp fails."
      - "Target fixture before prediction timestamp fails."
      - "Future snapshot fails."

# =============================================================================
# PHASE 04 — TEAM AND CONTEXT
# =============================================================================

  - id: MODEL-001
    phase: PHASE-04
    title: "Implement Team Strength baselines"
    priority: P0
    status: not_started
    depends_on:
      - DATA-013
      - DATA-015

    baselines:
      - league_average
      - rolling_goals
      - rolling_xg
      - poisson

    outputs:
      - "src/fpl_engine/models/team_strength/baselines.py"

    tests:
      - "Features contain only past matches."
      - "Goal distributions sum to one."

  - id: MODEL-002
    phase: PHASE-04
    title: "Implement Dixon-Coles Team Strength model"
    priority: P0
    status: not_started
    depends_on:
      - MODEL-001

    specification:
      - "docs/02_MODELS/team_strength.md"

    required:
      - attack_strength
      - defence_strength
      - home_advantage
      - score_distribution
      - clean_sheet_probability

    tests:
      - "Expected goals non-negative."
      - "Fixture home/away outputs coherent."

  - id: MODEL-003
    phase: PHASE-04
    title: "Add Team Strength time decay and priors"
    priority: P0
    status: not_started
    depends_on:
      - MODEL-002

    required:
      - exponential time decay
      - previous-season prior
      - promoted-team shrinkage

    tests:
      - "Early-season predictions use prior."
      - "Prior influence declines with evidence."

  - id: MODEL-004
    phase: PHASE-04
    title: "Add Team Strength regime context"
    priority: P1
    status: not_started
    depends_on:
      - MODEL-003
      - CONTEXT-002

    features:
      - manager_change
      - fixture_congestion

    tests:
      - "Pre-manager history retained."
      - "Regime weighting is temporal."

  - id: CONTEXT-001
    phase: PHASE-04
    title: "Implement tactical role taxonomy"
    priority: P0
    status: not_started

    specification:
      - "docs/02_MODELS/tactical_context.md"

    outputs:
      - "src/fpl_engine/features/tactical_roles.py"

    tests:
      - "FPL position remains distinct from tactical role."

  - id: CONTEXT-002
    phase: PHASE-04
    title: "Implement temporal tactical context engine"
    priority: P0
    status: not_started
    depends_on:
      - CONTEXT-001
      - DATA-006
      - DATA-010
      - ID-006

    outputs:
      - current_tactical_role
      - dominant_formation
      - manager_regime
      - regime_flags
      - role_confidence

    tests:
      - "Future target lineup never used."
      - "Manual override respects knowledge time."

  - id: CONTEXT-003
    phase: PHASE-04
    title: "Implement set-piece hierarchy"
    priority: P0
    status: not_started
    depends_on:
      - CONTEXT-002

    types:
      - penalties
      - direct_free_kicks
      - indirect_free_kicks
      - corners_left
      - corners_right

    tests:
      - "Hierarchy is temporal."
      - "Unavailable first taker falls to next ranked player."

  - id: CONTEXT-004
    phase: PHASE-04
    title: "Implement squad competition features"
    priority: P0
    status: not_started
    depends_on:
      - CONTEXT-002

    outputs:
      - role_competitor_set
      - squad_competition_score
      - role_security_score

    tests:
      - "Competition is role-specific."

  - id: CONTEXT-005
    phase: PHASE-04
    title: "Implement availability context"
    priority: P0
    status: not_started
    depends_on:
      - DATA-003
      - DATA-005
      - DATA-006

    outputs:
      - availability_probability
      - suspension_block
      - injury_severity_bucket
      - workload_score
      - availability_confidence

    tests:
      - "Confirmed suspension blocks target fixture."
      - "Historical status uses pre-deadline information."

# =============================================================================
# PHASE 05 — MINUTES AND TALENT
# =============================================================================

  - id: MIN-001
    phase: PHASE-05
    title: "Build Minutes training dataset"
    priority: P0
    status: not_started
    depends_on:
      - DATA-012
      - CONTEXT-004
      - CONTEXT-005
      - DATA-015

    targets:
      - appeared
      - started
      - minutes

    outputs:
      - "src/fpl_engine/features/minutes_dataset.py"

    tests:
      - "Target-match lineup never exists in features."
      - "All feature timestamps <= prediction timestamp."

  - id: MIN-002
    phase: PHASE-05
    title: "Implement Minutes baselines"
    priority: P0
    status: not_started
    depends_on:
      - MIN-001

    baselines:
      - previous_match_minutes
      - rolling_5_minutes
      - rolling_5_start_rate
      - empirical_hurdle

    tests:
      - "xMins within valid range."

  - id: MIN-003
    phase: PHASE-05
    title: "Implement appearance and start models"
    priority: P0
    status: not_started
    depends_on:
      - MIN-002

    preferred:
      - CatBoostClassifier

    outputs:
      - p_appearance
      - p_start

    tests:
      - "Probabilities in [0,1]."

  - id: MIN-004
    phase: PHASE-05
    title: "Implement starter minutes model"
    priority: P0
    status: not_started
    depends_on:
      - MIN-003

    outputs:
      - starter_minutes_distribution

    tests:
      - "Distribution sums to one."

  - id: MIN-005
    phase: PHASE-05
    title: "Implement bench appearance/minutes model"
    priority: P0
    status: not_started
    depends_on:
      - MIN-003

    outputs:
      - p_bench_appearance
      - bench_minutes_distribution

  - id: MIN-006
    phase: PHASE-05
    title: "Implement complete Minutes mixture"
    priority: P0
    status: not_started
    depends_on:
      - MIN-004
      - MIN-005

    outputs:
      - p_zero_minutes
      - p_start
      - expected_minutes
      - p_60_plus
      - p_75_plus
      - p_90
      - minute_bucket_distribution
      - minutes_uncertainty

    tests:
      - "p90 <= p75 <= p60 <= p_appearance."
      - "Distribution sums to one."

  - id: MIN-007
    phase: PHASE-05
    title: "Calibrate Minutes probabilities"
    priority: P0
    status: not_started
    depends_on:
      - MIN-006

    candidates:
      - isotonic
      - platt

    tests:
      - "Calibration artifact fitted only on historical training/validation data."

  - id: TAL-001
    phase: PHASE-05
    title: "Build Player Talent feature dataset"
    priority: P0
    status: not_started
    depends_on:
      - DATA-012
      - MODEL-003
      - CONTEXT-002

    required_features:
      - npxg_per90
      - xa_per90
      - shots_per90
      - team_share
      - tactical_role
      - opponent_strength

  - id: TAL-002
    phase: PHASE-05
    title: "Implement Talent baselines"
    priority: P0
    status: not_started
    depends_on:
      - TAL-001

    baselines:
      - season_to_date_per90
      - exponentially_weighted_per90

  - id: TAL-003
    phase: PHASE-05
    title: "Implement empirical Bayes shrinkage"
    priority: P0
    status: not_started
    depends_on:
      - TAL-002

    hierarchy:
      - position
      - tactical_role
      - player

    outputs:
      - talent_npxg_per90
      - talent_xa_per90
      - uncertainty
      - sample_reliability

  - id: TAL-004
    phase: PHASE-05
    title: "Implement team-share talent adjustment"
    priority: P0
    status: not_started
    depends_on:
      - TAL-003

    features:
      - npxg_share
      - xa_share
      - shot_share
      - box_touch_share_when_available

  - id: TAL-005
    phase: PHASE-05
    title: "Implement transfer and regime weighting"
    priority: P0
    status: not_started
    depends_on:
      - TAL-004
      - CONTEXT-002
      - ID-005

    tests:
      - "Old history retained."
      - "Context weight changes after transfer."

  - id: TAL-006
    phase: PHASE-05
    title: "Implement cross-league translation baseline"
    priority: P1
    status: not_started
    depends_on:
      - TAL-005

    objective: >
      Estimate Premier League translation using historical cross-league transfers
      when sufficient data exists.

    fallback:
      - role_prior
      - high_uncertainty

    tests:
      - "Unsupported league never receives invented coefficient."

# =============================================================================
# PHASE 06 — EVENT MODELS
# =============================================================================

  - id: EVT-001
    phase: PHASE-06
    title: "Implement Player Fixture Rate model"
    priority: P0
    status: not_started
    depends_on:
      - MODEL-003
      - MIN-006
      - TAL-005
      - CONTEXT-003

    outputs:
      - fixture_npxg_per90
      - fixture_penalty_xg_per90
      - fixture_xa_per90
      - fixture_defcon_per90

  - id: EVT-002
    phase: PHASE-06
    title: "Implement Goal Model baseline"
    priority: P0
    status: not_started
    depends_on:
      - EVT-001

    outputs:
      - expected_goals
      - p_goal
      - goal_distribution

  - id: EVT-003
    phase: PHASE-06
    title: "Implement penalty process"
    priority: P0
    status: not_started
    depends_on:
      - CONTEXT-003
      - EVT-002

