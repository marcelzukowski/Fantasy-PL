# =============================================================================
# FIRST CODEX TASK
# =============================================================================

first_task:
  id: CORE-001

  recommended_prompt: >
    Read docs/00_PROJECT_CONTEXT.md and docs/06_PROJECT/roadmap.yaml.
    Implement only task CORE-001.
    Do not implement later tasks.
    Run the relevant tests before finishing.

# =============================================================================
# CODEX PROMPT TEMPLATE
# =============================================================================

codex_prompt_template: |

  Read:
  - docs/00_PROJECT_CONTEXT.md
  - docs/06_PROJECT/roadmap.yaml
  - the specification files relevant to TASK_ID

  Implement only TASK_ID.

  Requirements:
  - follow existing documented interfaces,
  - do not implement unrelated future tasks,
  - preserve point-in-time safety,
  - add/update tests,
  - run relevant tests,
  - report files changed and test results.

# =============================================================================
# CORE MILESTONES
# =============================================================================

milestones:

  M1_DATA_READY:
    required_tasks:
      - DATA-003
      - DATA-004
      - DATA-005
      - DATA-006
      - ID-002
      - ID-003
      - ID-004
      - DATA-012
      - DATA-013
      - DATA-014
      - DATA-015

    result: >
      Historical and current canonical point-in-time datasets can be created.

  M2_CORE_MODELS:
    required_tasks:
      - MODEL-003
      - CONTEXT-005
      - MIN-007
      - TAL-005
      - EVT-009

    result: >
      Team, minutes, talent, context and event probabilities are available.

  M3_PROJECTIONS:
    required_tasks:
      - SIM-012
      - SCORE-002
      - PROJ-005

    result: >
      Player point distributions and 1/3/6 GW projections are available.

  M4_OPTIMIZER:
    required_tasks:
      - OPT-009
      - OPT-016

    result: >
      Transfers, roll FT, XI, captain and multi-GW decisions are available.

  M5_VALIDATED:
    required_tasks:
      - BT-003
      - BT-004
      - BT-005
      - BT-006
      - BT-007
      - BT-008
      - BT-010

    result: >
      Core prediction and decision system has documented out-of-sample evidence.

  M6_PRODUCTION:
    required_tasks:
      - PIPE-001
      - PIPE-002
      - PIPE-003
      - PIPE-004
      - PIPE-005
      - PIPE-006
      - PIPE-007

    result: >
      One production command can update data, create projections and return
      an FPL recommendation.

# =============================================================================
# FINAL ACCEPTANCE
# =============================================================================

project_acceptance_criteria:

  data:
    - "Current and historical data ingestion works."
    - "Canonical identity resolution works."
    - "Point-in-time leakage checks pass."
    - "No paid data provider is required."

  models:
    - "Team Strength beats documented baseline."
    - "Minutes beats documented baseline."
    - "Player Talent beats documented baseline."
    - "Event probabilities are calibrated."

  simulation:
    - "Match events are internally coherent."
    - "Simulation is reproducible."
    - "Monte Carlo convergence is acceptable."

  scoring:
    - "Season-specific FPL scoring is configuration-driven."

  projection:
    - "1GW, 3GW and 6GW projections exist."
    - "Probability distributions and uncertainty are available."

  optimizer:
    - "ROLL FT is a valid outcome."
    - "Hits are correctly priced."
    - "XI, bench, captain and vice are optimized."
    - "6GW transfer planning works."
    - "Sensitivity/confidence is available."

  validation:
    - "Walk-forward backtests exist."
    - "Strict point-in-time mode exists."
    - "Advanced models are promoted only when they beat baselines."

  production:
    - "Pipeline can run end to end."
    - "Final output is machine-readable."
    - "LLM is not required for raw prediction or mathematical optimization."

final_rule: >
  Implement the simplest correct version of each final-architecture component
  first, validate it, and only then introduce additional complexity when
  out-of-sample evidence demonstrates measurable value.
```
