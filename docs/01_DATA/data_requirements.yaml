    point_in_time: false
    update_frequency: per_prediction
    models_using: [backtesting, reporting]
    leakage_risk: none

  feature_version:
    entity: prediction_snapshot
    dtype: string
    category: reproducibility
    primary_source: system
    required: true
    point_in_time: false
    update_frequency: per_prediction
    models_using: [backtesting, reporting]
    leakage_risk: none

# -----------------------------------------------------------------------------
# DERIVED FEATURE GROUPS
# -----------------------------------------------------------------------------

derived_feature_groups:

  rolling_player_form:
    required: true
    source_requirements:
      - minutes_played
      - expected_goals
      - expected_assists
      - shots
      - shots_in_box
      - shots_on_target
      - big_chances
      - big_chances_created
      - key_passes
      - touches_in_box
    windows:
      - matches_3
      - matches_5
      - matches_10
      - days_30
      - season_to_date
    weighting:
      default: exponential_time_decay
      tune_via_backtest: true
    leakage_policy: "Only completed matches before prediction_timestamp."

  rolling_team_strength:
    required: true
    source_requirements:
      - team_goals_for
      - team_goals_against
      - team_xg
      - team_xga
      - team_shots
      - team_shots_on_target
      - possession_pct
    weighting:
      opponent_adjustment: true
      home_away_split: true
      exponential_time_decay: true
      tune_via_backtest: true

  player_team_share:
    required: true
    outputs:
      - share_team_npxg
      - share_team_xa
      - share_team_shots
      - share_team_box_touches
    purpose:
      - "Separate player attacking involvement from team environment."
    leakage_policy: "Only completed matches before prediction_timestamp."

  minutes_features:
    required: true
    outputs:
      - start_rate_last_3
      - start_rate_last_5
      - xmins_empirical_last_5
      - avg_sub_off_minute
      - bench_rate
      - p_60_empirical
      - p_75_empirical
      - p_90_empirical
      - workload_7d
      - workload_14d
    leakage_policy: "Only known appearances and schedules before prediction_timestamp."

  fixture_context:
    required: true
    outputs:
      - opponent_attack_strength
      - opponent_defence_strength
      - expected_team_goals
      - expected_goals_against
      - clean_sheet_probability
      - home_advantage
      - congestion_score

  regime_change_features:
    required: true
    outputs:
      - days_since_club_change
      - days_since_manager_change
      - days_since_role_change
      - days_since_set_piece_change
      - post_change_matches
      - pre_change_weight
      - post_change_weight
    notes:
      - "Weighting mechanism must be learned or validated in walk-forward backtests."

