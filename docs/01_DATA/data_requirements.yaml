    dtype: string
    category: identity
    primary_source: internal_identity_registry
    fallback_source: manual_mapping
    required: true
    point_in_time: false
    update_frequency: on_discovery
    models_using: [all]
    leakage_risk: none
    notes:
      - "Stable internal ID. Never use provider IDs as the canonical key."

  player_name:
