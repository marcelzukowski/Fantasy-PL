version: 1

description: >
  Canonical Data Requirement Matrix for the FPL Prediction & Decision Engine.
  Every raw field, contextual signal and derived feature used by the final system
  must be represented here with source priority, fallback strategy, temporal
  availability, leakage policy and consuming model(s).

global_rules:
  canonical_time_zone: "UTC"
  prediction_principle: "what_was_known_at_prediction_time"
  default_prediction_horizon_gameweeks: 6
  raw_data_immutable: true
  retain_raw_snapshots: true
  require_retrieval_timestamp: true
  require_source_provenance: true
  require_point_in_time_validation_for_backtests: true
  missing_data_policy: "explicit_missingness; never silently forward-fill across regime changes"
  derived_features_rule: >
    Every derived feature must be reproducible solely from source records whose
    effective availability timestamp is <= prediction_timestamp.
  source_priority_rule: >
    Prefer the primary source. Use fallback only when the primary source is unavailable,
    stale, incomplete or fails validation. Persist which source was actually used.
  no_silent_overrides: true

entities:
  player:
    grain: "one football player"
    canonical_key: "player_id"

  team:
    grain: "one football club"
    canonical_key: "team_id"

  manager:
    grain: "one manager/coaching regime"
    canonical_key: "manager_id"

  fixture:
    grain: "one football match"
    canonical_key: "fixture_id"

  gameweek:
    grain: "one FPL gameweek"
    canonical_key: "gameweek_id"

  player_fixture:
    grain: "one player in one fixture"
    canonical_key: ["player_id", "fixture_id"]

  team_fixture:
    grain: "one team in one fixture"
    canonical_key: ["team_id", "fixture_id"]

  prediction_snapshot:
    grain: "state known at a specific prediction time"
    canonical_key: ["prediction_timestamp", "target_gameweek"]

  manager_team_spell:
    grain: "one manager spell at one club"
    canonical_key: ["manager_id", "team_id", "effective_from"]

  player_team_spell:
    grain: "one player spell at one club"
    canonical_key: ["player_id", "team_id", "effective_from"]

  fpl_squad_snapshot:
    grain: "user squad state at a specific time"
    canonical_key: ["fpl_manager_id", "snapshot_timestamp"]

requirement_schema:
  required_fields:
    - entity
    - dtype
    - category
    - primary_source
    - required
    - point_in_time
    - models_using
    - leakage_risk

