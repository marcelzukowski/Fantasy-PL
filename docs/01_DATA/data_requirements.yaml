    default_action: exclude

# -----------------------------------------------------------------------------
# DATA QUALITY REQUIREMENTS
# -----------------------------------------------------------------------------

quality_checks:

  identity:
    - "Every provider player ID maps to exactly one canonical player_id within an effective date range."
    - "Every provider team ID maps to exactly one canonical team_id within an effective date range."
    - "Duplicate fixture mappings are forbidden."

  temporal:
    - "effective_at <= prediction_timestamp for every training/backtest feature."
    - "Target fixture kickoff must be > prediction_timestamp."
    - "Historical snapshots must use latest defensible record available before prediction time."

  numeric:
    - "minutes_played between 0 and 120."
    - "probabilities between 0 and 1."
    - "xG/xA values non-negative."
    - "FPL price positive."

  consistency:
    - "player_fixture team_id must match active player_team_spell at fixture time."
    - "home_team_id != away_team_id."
    - "started=true implies minutes_played > 0 unless source correction is explicitly recorded."
    - "penalty_goals <= penalty_attempts."
    - "goals_conceded non-negative."

  missingness:
    - "Missing advanced stats must be explicit nulls, not zeros."
    - "Source outages must be distinguishable from genuine zero values."
    - "Fallback use must be logged."

# -----------------------------------------------------------------------------
# INGESTION PRIORITY
# -----------------------------------------------------------------------------

ingestion_order:
  - canonical_identity
  - official_fpl_current_state
  - fpl_point_in_time_snapshots
  - historical_fpl_gameweeks
  - fixtures_and_results
  - advanced_player_match_stats
  - advanced_team_match_stats
  - lineups_and_formations
  - injuries_and_suspensions
  - transfers_and_manager_spells
  - set_piece_context
  - bookmaker_market
  - manual_context_overrides
  - derived_features
